server {
    listen       5988;
    server_name  localhost;
    client_max_body_size 0;

    #access_log  /var/log/nginx/host.access.log  main;

    location = / {
        return 200 'Hello from CHT api mock';
    }

    location = /somepath {
        return 200 'Test';
    }

    location /echo/ {
        return 200 $request_uri;
    }

    location = /error/drop {
        return 444;
    }
}
