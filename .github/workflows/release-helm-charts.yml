name: Release Helm Charts

on:
  push:
    tags:
      - '*'

permissions:
  contents: write  # Required to attach files to GitHub releases

jobs:
  build-helm-charts:
    name: Package Helm Charts and save to GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install dependencies # does this need to have keys/repos added? https://helm.sh/docs/intro/install/
        run: |
          sudo apt-get update
          sudo apt-get install helm

      - name: Generate Helm Chart
        working-directory: scripts/build/helm
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          package-chart.sh $TAG_VERSION

      - name: Commit and push new helm chart to GH
        run: |
          git config --global user.name "helm-chart-ci"
          git config --global user.email "development+helm-chart-ci@medic.org"
          git checkout -b "$TAG_VERSION-helm-chart"
          git add .
          git commit -am "$TAG_VERSION new helm chart (GH CI Helm Release Bot)"
          git push 
          gh pr create \
            --title "$TAG_VERSION new helm chart (GH CI Helm Release Bot)" \
            --body "$TAG_VERSION new helm chart"

jobs:
  publish-helm-charts:
    name: Publish Helm Charts to Docs Site
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Attach Helm Chart to Release
        run: gh release upload "$TAG_NAME" release-assets/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
