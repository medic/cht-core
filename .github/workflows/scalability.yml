name: Scalability Workflow

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  STAGING_SERVER: ${{ secrets.AUTH_MARKET_URL && '_couch/builds_4' || '_couch/builds_external' }}
  MARKET_URL_READ: 'https://staging.dev.medicmobile.org'
  INTERNAL_CONTRIBUTOR: ${{ secrets.SCALABILITY_ARN && 'true' }}
  SCALABILITY_ARN: ${{ secrets.SCALABILITY_ARN }}
  BRANCH: ${{ github.head_ref || github.ref_name }}
  BUILD_NUMBER: ${{ github.run_id }}
  SCALABILITY_RESULTS_TOKEN: ${{ secrets.SCALABILITY_RESULTS_TOKEN }}

jobs:
  build:
    name: Set up Medic on EC2 and Execute Jmeter on another EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Configure AWS Credentials
        if: ${{ env.INTERNAL_CONTRIBUTOR }}
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885  # v6.1.1
        with:
          aws-access-key-id: ${{ secrets.SCALABILITY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SCALABILITY_SECRET_ACCESS_KEY }}
          aws-region: ca-central-1
      - name: Start EC2 and CHT
        if: ${{ env.INTERNAL_CONTRIBUTOR }}
        run: cd tests/scalability && ./start-ec2-cht.sh $BRANCH

      - name: Confirm scalability results were published
        timeout-minutes: 65
        env:
          GH_TOKEN: ${{ secrets.SCALABILITY_RESULTS_TOKEN }}
          RESULTS_PATH: ${{ github.ref_name }}-${{ github.run_id }}
        run: |
          set -euo pipefail

          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT

          repository_status=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/medic/scalability-results)
          if [ "$repository_status" != 200 ]; then
            echo "::error::Cannot access medic/scalability-results (GitHub API returned HTTP $repository_status)."
            jq -r '.message // .' "$response_file"
            exit 1
          fi

          encoded_results_path=$(jq -rn --arg path "$RESULTS_PATH" '$path | @uri')
          results_url="https://api.github.com/repos/medic/scalability-results/contents/results/$encoded_results_path?ref=main"
          deadline=$((SECONDS + 3600))

          while (( SECONDS < deadline )); do
            status=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              "$results_url")

            if [ "$status" = 200 ]; then
              if jq -e 'type == "array" and length > 0' "$response_file" >/dev/null; then
                echo "Scalability results published to results/$RESULTS_PATH."
                exit 0
              fi
              echo "::error::The results path exists but contains no files."
              exit 1
            elif [ "$status" != 404 ]; then
              echo "::error::Failed to verify scalability results (GitHub API returned HTTP $status)."
              jq -r '.message // .' "$response_file"
              exit 1
            fi

            echo "Waiting for results/$RESULTS_PATH to be published..."
            sleep 60
          done

          echo "::error::Scalability results were not published within 60 minutes."
          exit 1